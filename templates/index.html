<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Performance Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
        }

        /* Floating blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite alternate;
        }
        body::before {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #7c3aed, #4f46e5);
            top: -120px; left: -120px;
        }
        body::after {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #06b6d4, #3b82f6);
            bottom: -100px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 30px) scale(1.08); }
        }

        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;
            max-width: 560px;
            width: 90%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #7c3aed, #4f46e5);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        h1 span {
            background: linear-gradient(90deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .cta {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 30px rgba(124,58,237,0.45);
        }
        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(124,58,237,0.6);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 44px;
            padding-top: 28px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item { text-align: center; }
        .stat-num {
            display: block;
            font-size: 1.6rem;
            font-weight: 800;
            color: #818cf8;
        }
        .stat-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="badge">🎓 ML Powered</div>
        <h1>Student <span>Performance</span> Predictor</h1>
        <p>Enter student details and get an instant AI-powered prediction of their Mathematics score based on key academic factors.</p>
        <a href="/predictdata" class="cta">Start Prediction →</a>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-num">6</span>
                <span class="stat-label">Features</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">ML</span>
                <span class="stat-label">Powered</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">100</span>
                <span class="stat-label">Max Score</span>
            </div>
        </div>
    </div>
</body>
</html>
